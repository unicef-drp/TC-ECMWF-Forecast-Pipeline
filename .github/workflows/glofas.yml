name: GloFAS Riverine Discharge Pipeline

on:
  # Once daily, comfortably past GloFAS's ~11h publication latency after the 00Z
  # ECMWF cycle it's derived from (ready ~11 UTC)
  schedule:
    - cron: '0 15 * * *'  # 15 UTC

  workflow_dispatch:
    inputs:
      download_date:
        description: 'Specific date to download (YYYY-MM-DD, leave empty for today UTC)'
        required: false
        type: string
      cleanup:
        description: 'Clean up temporary files after load'
        required: false
        type: boolean
        default: true

jobs:
  run-glofas-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-glofas.txt'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-glofas.txt

      - name: Create directories
        run: |
          mkdir -p glofas_data

      - name: Run GloFAS Pipeline
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_STAGE_NAME: ${{ secrets.SNOWFLAKE_STAGE_NAME }}

          DATA_PIPELINE_DB: 'SNOWFLAKE'
          DOWNLOAD_DATE: ${{ github.event.inputs.download_date }}
          GLOFAS_DATA_DIR: 'glofas_data'
          GLOFAS_THRESHOLD_SOURCE: 'snowflake'
          CLEANUP_AFTER_LOAD: ${{ github.event.inputs.cleanup || 'true' }}

          # CDS API credentials — see ~/.cdsapirc format at https://cds.climate.copernicus.eu
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          python github_actions/glofas_pipeline.py

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glofas-pipeline-logs-${{ github.run_number }}
          path: |
            glofas_pipeline.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::GloFAS pipeline failed! Check logs for details."
          exit 1
