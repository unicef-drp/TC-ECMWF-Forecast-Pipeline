name: TC Forecast Pipeline

on:
  # Run 4x daily, 1h20m after ECMWF EPS TC track data is available (~7h40m after each run)
  schedule:
    - cron: '0 3,9,15,21 * * *'  # 03/09/15/21 UTC — aligned to 18Z/00Z/06Z/12Z releases

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      download_date:
        description: 'Specific date to download (YYYYMMDD format, leave empty for latest)'
        required: false
        type: string
      run_time:
        description: 'Run time (00, 06, 12, or 18) - required when date is specified'
        required: false
        type: choice
        options: ['00', '06', '12', '18']
      cleanup:
        description: 'Clean up temporary files after load'
        required: false
        type: boolean
        default: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            libeccodes0
            libeccodes-dev
            libeccodes-tools
            libhdf5-dev
            libnetcdf-dev
            pkg-config
          version: 1.0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          echo "=== Checking critical packages ==="
          pip list | grep -E "(xarray|cfgrib|ecmwf|zarr)" || echo "Some packages missing!"

      - name: Create directories
        run: |
          mkdir -p tc_data
          mkdir -p tc_data_transformed
          mkdir -p precip_data/grib_tmp

      - name: Run TC Forecast Pipeline
        env:
          # Snowflake credentials from GitHub Secrets
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

          # Pipeline configuration
          DOWNLOAD_DATE: ${{ github.event.inputs.download_date }}
          RUN_TIME: ${{ github.event.inputs.run_time }}
          DOWNLOAD_LIMIT: '1'
          PROCESS_WIND_DATA: 'true'
          CLEANUP_AFTER_LOAD: ${{ github.event.inputs.cleanup || 'true' }}
          SKIP_EXISTING: 'false'  # Always process new data in CI

          # Precipitation processing (total precipitation - tp)
          PROCESS_PRECIP: 'true'
          PRECIP_DATA_DIR: 'precip_data'
          SNOWFLAKE_STAGE_NAME: ${{ secrets.SNOWFLAKE_STAGE_NAME }}
          # Headless matplotlib (no display available in CI)
          MPLBACKEND: 'Agg'
        run: |
          python github_actions/main.py

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: |
            pipeline.log
          retention-days: 30

      - name: Upload artifacts (if pipeline fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data-${{ github.run_number }}
          path: |
            tc_data/*.csv
            tc_data_transformed/*.csv
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Pipeline failed! Check logs for details."
          exit 1
